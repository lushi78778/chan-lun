name: test-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
  SOURCE_COMMIT: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: astral-sh/setup-uv@v5
      - name: Install the pinned development baseline
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip freeze
      - name: Check tag and source version before building
        run: python tools/release_artifacts.py check-source --tag "$RELEASE_TAG"
      - name: Build candidate once
        run: python -m build --no-isolation
      - name: Check package description before sealing
        run: |
          python -m twine check --strict dist/*.whl dist/*.tar.gz
          python tools/release_artifacts.py check-description
      - name: Seal candidate metadata and digests
        run: python tools/release_artifacts.py seal --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - name: Verify candidate before installation
        run: python tools/release_artifacts.py verify --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
      - name: Install sealed wheel
        run: |
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --force-reinstall --no-deps dist/*.whl
      - name: Verify installed wheel in isolation
        run: python -I tools/verify_installed.py
      - name: Run static checks and package coverage from sdist
        run: |
          mkdir -p "$RUNNER_TEMP/chan-sdist"
          tar -xzf dist/*.tar.gz -C "$RUNNER_TEMP/chan-sdist"
          cd "$RUNNER_TEMP/chan-sdist"/chan_lun_core-*
          python -m ruff check --no-cache src/chan tools tests
          python -m coverage run --data-file "$RUNNER_TEMP/chan-core.coverage" tools/check_core.py -v
          python -m coverage report --data-file "$RUNNER_TEMP/chan-core.coverage"
          python -m coverage json --data-file "$RUNNER_TEMP/chan-core.coverage" -o "$RUNNER_TEMP/chan-core-coverage.json"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: ${{ runner.temp }}/chan-core-coverage.json

  validation:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - name: Verify and install candidate for repository asset checks
        run: |
          python tools/release_artifacts.py verify --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
          uv pip install --system -r requirements-dev.txt
          uv pip install --system --force-reinstall --no-deps dist/*.whl
      - name: Check repository validation tools
        run: python -m ruff check --no-cache validation/tools validation/tests
      - name: Run independent repository asset validation
        run: python tools/check_core.py --scope validation -v

  legacy:
    needs: build
    runs-on: ubuntu-latest
    container: python:3.6.15-buster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - name: Verify candidate and install old runtime dependencies
        run: |
          python tools/release_artifacts.py verify --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
          python -m pip install 'pip==21.3.1'
          python -m pip install 'numpy==1.14.6' 'pandas==0.23.4' 'python-dateutil==2.8.2' 'six==1.16.0' 'pytz==2025.2'
          python -m pip install --no-deps dist/*.whl
      - name: Verify installed wheel and sdist package tests on Python 3.6
        run: |
          python -I tools/verify_installed.py
          mkdir -p /tmp/chan-sdist
          tar -xzf dist/*.tar.gz -C /tmp/chan-sdist
          cd /tmp/chan-sdist/chan_lun_core-*
          python tools/check_core.py -v

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, validation, legacy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - name: Verify the tested candidate before GitHub publication
        run: python tools/release_artifacts.py verify --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
      - name: Prepare release notes body
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_TAG"][1:]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = r"(?ms)^## " + re.escape(version) + r"(?:[（(][^\n]*|[ \t][^\n]*)?\n(.*?)(?=^## |\Z)"
          match = re.search(pattern, changelog)
          if not match or not match.group(1).strip():
              raise ValueError("CHANGELOG lacks release notes for " + version)
          body = "# chan-lun-core " + version + "\n\n" + match.group(1).strip() + "\n"
          Path("release_body.md").write_text(body, encoding="utf-8")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/release-manifest.json
          generate_release_notes: true

  publish-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, validation, legacy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - name: Verify and stage only the tested Python distributions
        run: |
          python tools/release_artifacts.py verify --dist candidate --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"
          mkdir dist
          cp candidate/*.whl candidate/*.tar.gz dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
