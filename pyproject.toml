# chan-lun-core 发行配置；仓库采用 src 布局，Python 导入名为 chan。
# version 与 src/chan/__init__.py 的 __version__ 保持一致。
[build-system]
# PEP 639 的 license 表达式与 license-files 支持基线。
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "chan-lun-core"
version = "1.0.1"
description = "缠论结构识别与理论辅助计算库。输入单标的、单周期的行情或结构序列，输出分型、笔、线段、中枢、背驰、买卖点，以及多级分解和辅助状态。算法用 Python 实现，第三方依赖只有 numpy 与 pandas；MACD 内置计算。"
readme = "README.md"
requires-python = ">=3.6"
# PEP 639: SPDX 表达式, pip show 显示为 "License: MIT"(不再内联全文)
license = "MIT"
# PEP 639: 显式随发行包保留许可证文件。
license-files = ["LICENSE"]
# 发行作者信息；不包含私人邮箱。
authors = [{name = "lushi78778"}]
keywords = [
    "chan", "chanlun", "缠论", "缠中说禅",
    "technical-analysis", "quant", "stock", "kline", "trading",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    # License classifier 已被 PEP 639 的 license = "MIT" 表达式取代
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    # 与聚宽研究环境(3.6.7 / numpy 1.14.6 / pandas 0.23.4)对齐的下限;
    # 现代环境另行验收，不改变旧运行时依赖下限。
    "numpy>=1.14",
    "pandas>=0.23",
]

[project.urls]
Homepage = "https://github.com/lushi78778/chan-lun"
Repository = "https://github.com/lushi78778/chan-lun"
Documentation = "https://github.com/lushi78778/chan-lun#readme"
Changelog = "https://github.com/lushi78778/chan-lun/blob/main/CHANGELOG.md"
Issues = "https://github.com/lushi78778/chan-lun/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["chan", "chan.*"]
namespaces = false

[tool.ruff]
# 只检查名称错误；Python 3.6 语法由包契约测试单独检查。
target-version = "py37"

[tool.ruff.lint]
select = ["F821", "F822", "F823"]

[tool.coverage.run]
branch = true
source = ["src/chan"]
relative_files = true

[tool.coverage.report]
precision = 2
show_missing = true
fail_under = 94
